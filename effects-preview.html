<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>차트아레나 · 이펙트 스튜디오</title><link rel="stylesheet" href="battle-fx.css?v=9531eb7c70b4"><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#254b6a,#0c1424 70%);color:#e8f0ff;font:14px/1.5 'Segoe UI','Malgun Gothic',sans-serif;min-height:100dvh;padding:28px}main{max-width:1000px;margin:auto}header{display:flex;align-items:center;gap:18px;margin-bottom:26px}header img{width:108px}header a{margin-left:auto;color:#aebed6;text-decoration:none;padding:12px}h1{font-size:28px;letter-spacing:-.04em;margin:0 0 6px}.intro{color:#aebed6;margin:0 0 22px}.table{padding:20px;border:1px solid #607491;border-radius:20px;background:#16273f;box-shadow:0 20px 55px #0005}.hud{display:flex;justify-content:space-between;margin-bottom:14px;color:#acbdd2;font-size:12px}.hud b{color:#efce83}.chart-wrap{border:1px solid #3c587c;border-radius:12px;overflow:hidden;background:#0a1423}canvas{width:100%;height:270px;display:block}.seats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.seat{padding:12px 18px;background:#223b59;border:1px solid #526b8b;border-radius:12px;display:flex;justify-content:space-between;align-items:center}.seat b{font-size:20px;color:#ffe1a0}#status{color:#acc4dd;min-height:26px;margin:18px 0 0}nav{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}button{font:700 13px/1.4 inherit;min-height:52px;border:1px solid #6989ac;border-radius:10px;color:#e9f4ff;background:#254465;cursor:pointer;padding:12px;touch-action:manipulation}button:hover{background:#355b82}button:active{transform:scale(.97)}button:focus-visible{outline:2px solid #f2cf80;outline-offset:3px}button[data-fx=win]{color:#332713;background:linear-gradient(#ffe4a0,#d9ab53);border-color:#ebcb7e}footer{font-size:12px;color:#96acc8;margin-top:20px}.tag{color:#ebc777;font-size:10px;letter-spacing:.14em;margin:0 0 8px}@media(max-width:600px){body{padding:14px}.table{padding:12px}h1{font-size:23px}canvas{height:225px}nav{grid-template-columns:1fr 1fr}.seat{padding:12px;font-size:12px}.seat b{font-size:17px}}@media(prefers-reduced-motion:reduce){button:active{transform:none}}
</style></head><body><main><header><img src="assets/logo_wordmark.png?v=3" alt="차트아레나"><a href="index.html">홈으로 →</a></header><p class="tag">CHART ARENA · EFFECT STUDIO</p><h1>승부의 순간을 눌러보세요.</h1><p class="intro">칩 투입부터 마지막 캔들, 골드 획득까지. 버튼으로 각각 재생할 수 있습니다.</p><section class="table"><div class="hud"><span>이펙트 미리보기</span><b>일반방 · 10배</b></div><div class="chart-wrap"><canvas id="fxChart" aria-label="이펙트 확인용 예시 차트"></canvas></div><div class="seats"><div class="seat" id="mySeat"><span>내 자리</span><b>20,000 G</b></div><div class="seat"><span>상대 자리</span><b>20,000 G</b></div></div><p id="status" role="status" aria-live="polite">확인할 이펙트를 선택하세요.</p></section><nav aria-label="이펙트 재생"><button data-fx="commit">10배 · 칩 투입</button><button data-fx="last">마지막 3봉</button><button data-fx="win">+10,000 G 획득</button><button data-fx="champion">최종 우승</button><button data-fx="loss">−1,000 G 손실</button><button data-fx="draw">무승부</button><button data-fx="sequence">전체 흐름 재생</button><button data-fx="inspect">우승 장면 고정</button><button data-fx="stop">이펙트 정지</button></nav><footer>연출 확인용입니다. 보유 골드는 바뀌지 않습니다. 기기의 모션 감소 설정을 지원합니다.</footer></main><script src="battle-fx.js?v=632f079ca815"></script><script>
const chart=document.getElementById('fxChart'),target=document.getElementById('mySeat'),status=document.getElementById('status');let timers=[];
function draw(){const r=chart.getBoundingClientRect(),d=devicePixelRatio||1;chart.width=r.width*d;chart.height=r.height*d;const c=chart.getContext('2d');c.scale(d,d);c.strokeStyle='#24364d';for(let y=35;y<r.height;y+=45){c.beginPath();c.moveTo(0,y);c.lineTo(r.width,y);c.stroke();}let old=150;for(let i=0;i<44;i++){const close=155-Math.sin(i*.45)*20-i*1.8+Math.cos(i*1.7)*9,x=18+i*(r.width-36)/44;c.strokeStyle=c.fillStyle=close<old?'#f46e87':'#589dff';c.beginPath();c.moveTo(x,Math.min(old,close)-8);c.lineTo(x,Math.max(old,close)+9);c.stroke();c.fillRect(x-3,Math.min(old,close),6,Math.max(2,Math.abs(close-old)));old=close;}c.fillStyle='#90a6c2';c.font='11px sans-serif';c.fillText('이펙트 확인용 예시 차트',12,r.height-12);}
function stop(){timers.forEach(clearTimeout);timers=[];ArenaFX.clear();}function later(fn,ms){timers.push(setTimeout(fn,ms));}
function play(name,button){stop();if(name==='commit'){ArenaFX.commit({from:button,anchor:chart,lev:10});status.textContent='칩을 중앙으로 투입하고 선택 확정을 표시합니다.';}if(name==='last'){[3,2,1].forEach((count,i)=>later(()=>ArenaFX.last({anchor:chart,count}),i*800));status.textContent='마지막 세 봉을 차례대로 강조합니다.';}if(name==='win'||name==='loss'||name==='draw'){const amount=name==='win'?10000:name==='loss'?-1000:0;ArenaFX.result({anchor:chart,target,amount});status.textContent='정산 연출 · '+(amount>0?'+':'')+amount.toLocaleString()+' G';}if(name==='champion'){ArenaFX.victory({anchor:chart});status.textContent='최종 우승 연출';}if(name==='inspect'){ArenaFX.victory({anchor:chart});ArenaFX.freeze();status.textContent='우승 장면 고정 · 다른 버튼을 누르면 다시 재생합니다.';}if(name==='stop')status.textContent='이펙트를 정지했습니다.';if(name==='sequence'){ArenaFX.commit({from:button,anchor:chart,lev:10});[3,2,1].forEach((count,i)=>later(()=>{status.textContent='마지막 '+count+'봉';ArenaFX.last({anchor:chart,count});},1300+i*800));later(()=>{ArenaFX.result({anchor:chart,target,amount:10000});status.textContent='정산 완료 · +10,000 G (미리보기)';},3900);}}
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('[data-fx]');if(b)play(b.dataset.fx,b);});window.addEventListener('resize',()=>{stop();draw();});window.addEventListener('pagehide',stop);draw();
</script></body></html>
